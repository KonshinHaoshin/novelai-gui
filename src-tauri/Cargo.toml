[package]
name = "novelai-gui"
version = "0.1.5"
description = "A desktop GUI for NovelAI image generation"
authors = ["Dongshan Randeng"]
edition = "2021"
default-run = "novelai-gui"

[features]
cli = ["dep:clap", "dep:image"]

[[bin]]
name = "novelai-cli"
path = "src/bin/novelai-cli.rs"
required-features = ["cli"]

[lib]
name = "novel_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
dirs = "5"
json5 = "0.4"
regex = "1"
futures-util = "0.3"
# keyring has no default backend; enable the native store for each desktop OS.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = "2"
