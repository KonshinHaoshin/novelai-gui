name: Build desktop packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: novelai-gui-macos-aarch64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: novelai-gui-windows-x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI binary
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --features cli --bin novelai-cli --release

      - name: Package macOS CLI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p cli-dist
          cp src-tauri/target/${{ matrix.target }}/release/novelai-cli cli-dist/
          tar -czf novelai-cli-macos-aarch64.tar.gz -C cli-dist novelai-cli

      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force cli-dist | Out-Null
          Copy-Item "src-tauri/target/${{ matrix.target }}/release/novelai-cli.exe" "cli-dist/novelai-cli.exe"
          Compress-Archive -Path "cli-dist/novelai-cli.exe" -DestinationPath "novelai-cli-windows-x86_64.zip" -Force

      - name: Upload CLI binary
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: novelai-cli-macos-aarch64
          path: novelai-cli-macos-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows CLI binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: novelai-cli-windows-x86_64
          path: novelai-cli-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build Tauri package
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }} --ci

      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 "src-tauri/target/${{ matrix.target }}/release/bundle/macos/NovelAI GUI.app"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: novelai-*
          path: release-assets
          merge-multiple: true

      - name: Collect release installers
        shell: bash
        run: |
          mkdir -p release-files
          find release-assets -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-files/ \;
          test -n "$(find release-files -type f -print -quit)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
